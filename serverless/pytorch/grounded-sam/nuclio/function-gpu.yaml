metadata:
  name: pytorch-grounded-sam
  annotations:
    name: Grounded-SAM (text → masks)
    type: detector
    framework: pytorch
    spec: |
      [
        {"id": 1, "name": "cardboard"},
        {"id": 2, "name": "paper"},
        {"id": 3, "name": "shopping_bag"}
      ]

spec:
  runtime: "python:3.9"
  handler: "main:handler"
  description: "Open-vocabulary: GroundingDINO boxes + SAM masks"

  build:
    baseImage: nvidia/cuda:11.8.0-cudnn8-runtime-ubuntu22.04
    commands:
      - apt-get update && apt-get install -y git python3-pip libgl1 libglib2.0-0 build-essential
      - ln -sf /usr/bin/python3 /usr/bin/python
      - pip3 install --no-cache-dir --upgrade pip setuptools wheel
      - pip3 install --no-cache-dir numpy pillow opencv-python tqdm pycocotools
      - pip3 install --no-cache-dir "torch>=2.1,<2.4" "torchvision>=0.16,<0.19" --index-url https://download.pytorch.org/whl/cu118
      - pip3 install --no-cache-dir huggingface_hub timm addict yapf supervision transformers
      - pip3 install --no-cache-dir "git+https://github.com/facebookresearch/segment-anything.git"
      - pip3 install --no-cache-dir groundingdino-py

  env:
    - name: LABELS
      value: "cardboard,paper,shopping_bag"
    - name: BOX_THRESHOLD
      value: "0.35"
    - name: TEXT_THRESHOLD
      value: "0.25"

  triggers:
    http:
      kind: http
      maxWorkers: 1

  platform:
    attributes:
      resources:
        limits:
          nvidia.com/gpu: 1
